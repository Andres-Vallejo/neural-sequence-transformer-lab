seed: 42
data:
  source: ag_news
  data_dir: data/raw
  train_url: https://raw.githubusercontent.com/mhjabreel/CharCnn_Keras/master/data/ag_news_csv/train.csv
  test_url: https://raw.githubusercontent.com/mhjabreel/CharCnn_Keras/master/data/ag_news_csv/test.csv
  text_column: text
  label_column: label
  max_length: 96
  batch_size: 64
  val_split: 0.1
  max_train_samples: 8000
  max_val_samples: 1000
  max_test_samples: 1000
training:
  epochs: 3
  learning_rate: 0.001
  weight_decay: 0.0001
  device: auto
models:
  embedding:
    embed_dim: 96
  bilstm:
    embed_dim: 96
    hidden_dim: 128
    num_layers: 2
    dropout: 0.2
  autoencoder:
    embed_dim: 96
    hidden_dim: 128
    latent_dim: 96
  transformer:
    embed_dim: 128
    depth: 3
    num_heads: 4
    mlp_dim: 256
    dropout: 0.1
outputs:
  checkpoint_dir: outputs/checkpoints
  metrics_dir: outputs/metrics
