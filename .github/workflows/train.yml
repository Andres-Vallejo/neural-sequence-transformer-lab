name: Train sequence models

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to train
        required: true
        default: transformer
        type: choice
        options:
          - embedding
          - bilstm
          - autoencoder
          - transformer
      epochs:
        description: Number of epochs
        required: true
        default: "25"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "configs/**"
      - "requirements.txt"
      - ".github/workflows/train.yml"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Train selected model
        run: |
          MODEL="${{ github.event.inputs.model || 'transformer' }}"
          EPOCHS="${{ github.event.inputs.epochs || '25' }}"
          python src/train.py --model "$MODEL" --epochs "$EPOCHS"
      - name: Evaluate classifier
        if: ${{ github.event.inputs.model != 'autoencoder' }}
        run: |
          MODEL="${{ github.event.inputs.model || 'transformer' }}"
          python src/evaluate.py --model "$MODEL"
      - name: Upload experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sequence-training-artifacts
          path: outputs/
